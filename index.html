<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PORT Startup Expo | Coming Soon</title>

    <meta name="description" content="PORT Startup Expo - Connecting startups, innovators, investors and the global entrepreneurial ecosystem. Coming Soon.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background:
                radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.20), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(124, 58, 237, 0.18), transparent 30%),
                #050b18;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        .background-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 40px 25px 90px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 55px;
        }

        .logo-mark {
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #3b82f6, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: 800;
            margin-right: 14px;
            box-shadow: 0 10px 35px rgba(59, 130, 246, 0.25);
        }

        .logo-text {
            text-align: left;
        }

        .logo-text strong {
            display: block;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .logo-text span {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 3px;
            margin-top: 3px;
        }

        /* =========================
           TAG
        ========================= */

        .tag {
            display: inline-block;
            max-width: 100%;
            padding: 9px 18px;
            border: 1px solid rgba(96, 165, 250, 0.35);
            border-radius: 50px;
            color: #93c5fd;
            background: rgba(59, 130, 246, 0.08);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        /* =========================
           MAIN HEADING
        ========================= */

        h1 {
            font-size: clamp(48px, 8vw, 92px);
            line-height: 0.95;
            font-weight: 800;
            letter-spacing: -4px;
            margin-bottom: 25px;
        }

        h1 .highlight {
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* =========================
           DESCRIPTION
        ========================= */

        .description {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            color: #a7b3c7;
            font-size: 18px;
            line-height: 1.7;
        }

        /* =========================
           DIVIDER
        ========================= */

        .divider {
            width: 70px;
            height: 3px;
            margin: 38px auto;
            border-radius: 10px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            font-size: 15px;
            color: #64748b;
            letter-spacing: 0.5px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            position: fixed;
            bottom: 22px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            text-align: center;
            color: #475569;
            font-size: 12px;
            z-index: 3;
        }


        /* ==================================================
           TABLET
           601px - 1024px
        ================================================== */

        @media (min-width: 601px) and (max-width: 1024px) {

            .container {
                max-width: 850px;
                padding: 40px 35px 100px;
            }

            .logo {
                margin-bottom: 45px;
            }

            h1 {
                font-size: clamp(58px, 9vw, 78px);
                letter-spacing: -3px;
            }

            .description {
                max-width: 620px;
                font-size: 17px;
            }

            .divider {
                margin: 32px auto;
            }
        }


        /* ==================================================
           MOBILE
           Up to 600px
        ================================================== */

        @media (max-width: 600px) {

            body {
                min-height: 100dvh;
                align-items: center;
            }

            .container {
                width: 100%;
                max-width: 100%;
                padding: 30px 20px 80px;
            }

            /* Logo */

            .logo {
                margin-bottom: 38px;
            }

            .logo-mark {
                width: 46px;
                height: 46px;
                min-width: 46px;
                border-radius: 12px;
                font-size: 22px;
                margin-right: 11px;
            }

            .logo-text strong {
                font-size: 21px;
            }

            .logo-text span {
                font-size: 9px;
                letter-spacing: 2.5px;
            }

            /* Tag */

            .tag {
                font-size: 10px;
                letter-spacing: 1.5px;
                padding: 8px 14px;
                margin-bottom: 20px;
            }

            /* Heading */

            h1 {
                font-size: clamp(44px, 14vw, 65px);
                line-height: 0.98;
                letter-spacing: -2.5px;
                margin-bottom: 22px;
            }

            /* Description */

            .description {
                max-width: 520px;
                font-size: 15px;
                line-height: 1.65;
            }

            /* Divider */

            .divider {
                width: 60px;
                height: 3px;
                margin: 30px auto;
            }

            /* Message */

            .message {
                font-size: 14px;
                line-height: 1.6;
            }

            /* Footer */

            footer {
                position: static;
                width: 100%;
                margin-top: 55px;
                padding: 0 15px 20px;
                font-size: 11px;
            }
        }


        /* ==================================================
           SMALL PHONES
           Up to 400px
        ================================================== */

        @media (max-width: 400px) {

            .container {
                padding: 25px 16px 60px;
            }

            .logo {
                margin-bottom: 32px;
            }

            .logo-mark {
                width: 42px;
                height: 42px;
                min-width: 42px;
                border-radius: 11px;
                font-size: 20px;
                margin-right: 10px;
            }

            .logo-text strong {
                font-size: 19px;
            }

            .logo-text span {
                font-size: 8px;
                letter-spacing: 2px;
            }

            .tag {
                font-size: 9px;
                letter-spacing: 1.2px;
                padding: 7px 12px;
            }

            h1 {
                font-size: clamp(40px, 14vw, 54px);
                letter-spacing: -2px;
                margin-bottom: 20px;
            }

            .description {
                font-size: 14px;
                line-height: 1.6;
            }

            .divider {
                margin: 27px auto;
            }

            .message {
                font-size: 13px;
            }

            footer {
                margin-top: 45px;
                font-size: 10px;
            }
        }


        /* ==================================================
           VERY SMALL PHONES
           Up to 350px
        ================================================== */

        @media (max-width: 350px) {

            .container {
                padding-left: 13px;
                padding-right: 13px;
            }

            .logo-mark {
                width: 40px;
                height: 40px;
                min-width: 40px;
                font-size: 19px;
            }

            .logo-text strong {
                font-size: 18px;
            }

            .logo-text span {
                font-size: 7px;
                letter-spacing: 1.7px;
            }

            .tag {
                font-size: 8px;
                letter-spacing: 1px;
                padding: 7px 10px;
            }

            h1 {
                font-size: 38px;
            }

            .description {
                font-size: 13px;
            }

            .message {
                font-size: 12px;
            }
        }


        /* ==================================================
           MOBILE LANDSCAPE
        ================================================== */

        @media (max-width: 900px) and (orientation: landscape) {

            body {
                align-items: flex-start;
            }

            .container {
                padding-top: 30px;
                padding-bottom: 50px;
            }

            .logo {
                margin-bottom: 25px;
            }

            h1 {
                font-size: clamp(42px, 9vw, 65px);
                margin-bottom: 18px;
            }

            .description {
                font-size: 14px;
                line-height: 1.5;
            }

            .divider {
                margin: 22px auto;
            }

            footer {
                position: static;
                margin-top: 35px;
            }
        }
    </style>
</head>

<body>

    <div class="background-grid"></div>

    <main class="container">

        <!-- LOGO / BRAND -->
        <div class="logo">

            <div class="logo-mark">
                P
            </div>

            <div class="logo-text">
                <strong>PORT</strong>
                <span>STARTUP EXPO</span>
            </div>

        </div>


        <!-- COMING SOON -->

        <div class="tag">
            Something New Is Coming
        </div>

        <h1>
            Coming <span class="highlight">Soon.</span>
        </h1>

        <p class="description">
            A global platform bringing together startups, innovators,
            investors, industry leaders and the entrepreneurial ecosystem.
        </p>

        <div class="divider"></div>

        <p class="message">
            We're building something exciting. Stay tuned.
        </p>

    </main>


    <footer>
        © 2026 PORT Startup Expo. All rights reserved.
    </footer>

</body>
</html>
